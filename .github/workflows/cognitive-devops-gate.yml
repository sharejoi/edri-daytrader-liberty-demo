name: Multi-Agent AI Delivery Pipeline (tWAS -> WebSphere Liberty)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  agent-1-spec-discovery:
    name: "Agent 1: Spec & EJB Discovery Agent"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Legacy & Target Repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mine Legacy EJBs & tWAS Pools into NFR Passport
        run: python edri/evaluator/edri_discover.py
      - name: Publish NFR Passport to Agent Bus
        uses: actions/upload-artifact@v4
        with:
          name: nfr-passport-contract
          path: edri/specs/nfr-passport.yaml

  agent-2-cognitive-qe:
    name: "Agent 2: Cognitive QE Build & Test Agent"
    needs: agent-1-spec-discovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI-Migrated Liberty Code
        uses: actions/checkout@v4
      - name: Download NFR Passport Contract
        uses: actions/download-artifact@v4
        with:
          name: nfr-passport-contract
          path: edri/specs/
      - name: Set up Java 17 & Python for Automated Parity & XML Validation
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Validate Liberty XML Schema & EJB Source Integrity
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, glob
          xml_files = glob.glob('daytrader-app/**/server.xml', recursive=True)
          assert len(xml_files) > 0, 'No server.xml found in daytrader-app'
          tree = ET.parse(xml_files[0])
          java_files = glob.glob('daytrader-app/**/*.java', recursive=True)
          print(f'Verified valid Liberty {xml_files[0]} ({tree.getroot().tag}) and {len(java_files)} DayTrader Java source files.')
          assert len(java_files) > 0, 'No Java source files found'
          "

  agent-3-edri-release-deploy:
    name: "Agent 3: EDRI Governance & Deploy Agent"
    needs: [agent-1-spec-discovery, agent-2-cognitive-qe]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo & Evidence
        uses: actions/checkout@v4
      - name: Download NFR Passport Contract
        uses: actions/download-artifact@v4
        with:
          name: nfr-passport-contract
          path: edri/specs/
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute Two-Key Release Gate (QE Evidence + 2.5x Risk)
        run: python edri/evaluator/edri_gate.py
      - name: Package Verified Liberty Server Configuration & NFR Audit Bundle
        run: |
          mkdir -p release-bundle
          find daytrader-app -name "server.xml" -exec cp {} release-bundle/ \;
          cp edri/specs/nfr-passport.yaml release-bundle/
      - name: Publish Deployable Liberty Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: daytrader-liberty-deploy-package
          path: release-bundle/
